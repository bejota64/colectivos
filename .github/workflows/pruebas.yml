# Integracion continua del prototipo (Evaluaciones N3 y N4).
# En cada push a main y en cada pull request: levanta PostgreSQL 16 y
# MongoDB 7 con el mismo docker-compose.yml del equipo, y corre el analisis
# estatico, la compilacion, las pruebas unitarias, las de integracion, las
# pruebas de integridad de ambas bases y npm audit. Si un paso falla, el
# commit queda marcado en rojo.

name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Lint, unitarias e integracion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Santiago

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      # Credenciales aleatorias, solo para las bases desechables de esta
      # corrida. No hay contrasenas escritas en el repositorio.
      # La API usa las cuentas de permisos minimos (URL_POSTGRES, URL_MONGO);
      # las cuentas duenas (*_ADMIN) solo las usan las pruebas para limpiar.
      - name: Generar credenciales de prueba
        run: |
          PG=$(openssl rand -hex 24)
          MG=$(openssl rand -hex 24)
          PG_API=$(openssl rand -hex 24)
          MG_API=$(openssl rand -hex 24)
          for SECRETO in "$PG" "$MG" "$PG_API" "$MG_API"; do echo "::add-mask::$SECRETO"; done
          {
            echo "POSTGRES_USUARIO=colectivos_admin"
            echo "POSTGRES_CONTRASENA=$PG"
            echo "POSTGRES_API_USUARIO=colectivos_api"
            echo "POSTGRES_API_CONTRASENA=$PG_API"
            echo "MONGO_USUARIO=colectivos_admin"
            echo "MONGO_CONTRASENA=$MG"
            echo "MONGO_API_USUARIO=colectivos_api"
            echo "MONGO_API_CONTRASENA=$MG_API"
            echo "URL_POSTGRES=postgresql://colectivos_api:$PG_API@localhost:5432/colectivos"
            echo "URL_MONGO=mongodb://colectivos_api:$MG_API@localhost:27017/colectivos?authSource=colectivos"
            echo "URL_POSTGRES_ADMIN=postgresql://colectivos_admin:$PG@localhost:5432/colectivos"
            echo "URL_MONGO_ADMIN=mongodb://colectivos_admin:$MG@localhost:27017/?authSource=admin"
            echo "SECRETO_JWT=$(openssl rand -hex 32)"
            echo "NODE_ENV=test"
            echo "PUERTO=3000"
            echo "LIMITE_GENERAL_POR_MINUTO=100"
          } >> "$GITHUB_ENV"

      - name: Levantar PostgreSQL y MongoDB con datos de prueba
        run: docker compose up -d

      # Los healthcheck responden apenas parte el servidor temporal de
      # inicio, antes de que terminen los scripts de bd/*/inicio. Por eso se
      # espera el aviso de "init process complete" de cada imagen.
      - name: Esperar a que terminen los scripts de inicio
        run: |
          for i in $(seq 1 90); do
            PG=$(docker compose logs postgres | grep -c "init process complete" || true)
            MG=$(docker compose logs mongo | grep -c "init process complete" || true)
            if [ "$PG" -ge 1 ] && [ "$MG" -ge 1 ]; then
              docker compose up -d --wait
              echo "Bases listas con sus datos de prueba"
              exit 0
            fi
            sleep 2
          done
          echo "Las bases no terminaron de iniciar a tiempo"
          docker compose logs --no-color --tail=100
          exit 1

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-eva3/package-lock.json

      - name: Instalar dependencias
        working-directory: api-eva3
        run: npm ci

      - name: Analisis estatico (oxlint)
        working-directory: api-eva3
        run: npm run lint

      - name: Compilar (TypeScript estricto)
        id: compilar
        working-directory: api-eva3
        run: npm run build

      # Las etapas de prueba corren aunque una anterior falle (siempre que el
      # codigo compile), para ver en una sola corrida todo lo que falla.
      - name: Pruebas unitarias con cobertura
        if: ${{ !cancelled() && steps.compilar.outcome == 'success' }}
        working-directory: api-eva3
        run: npm run test:cov -- --ci

      - name: Pruebas de integracion contra las bases reales
        if: ${{ !cancelled() && steps.compilar.outcome == 'success' }}
        working-directory: api-eva3
        run: npm run test:e2e -- --ci

      # Las bases deben rechazar solas los datos invalidos, aunque la API
      # falle. Cada script imprime una linea OK o FALLA por comprobacion.
      - name: Integridad de PostgreSQL (restricciones CHECK, UNIQUE y FK)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USUARIO" -d colectivos \
            -v ON_ERROR_STOP=1 -f /scripts/pruebas_integridad.sql | tee integridad.txt
          grep -q "OK" integridad.txt
          ! grep -q "FALLA" integridad.txt

      - name: Validadores de MongoDB ($jsonSchema e indice unico)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          docker compose exec -T mongo sh -c 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --file /scripts/pruebas_validador.js' | tee validador.txt
          grep -q "OK" validador.txt
          ! grep -q "FALLA" validador.txt

      # Hallazgo V-03: lo que se despliega no puede tener NINGUNA
      # vulnerabilidad conocida, de cualquier severidad.
      - name: Dependencias de produccion sin vulnerabilidades conocidas
        if: ${{ !cancelled() }}
        working-directory: api-eva3
        run: npm audit --omit=dev --audit-level=low

      # Las herramientas de desarrollo (jest, @nestjs/cli) no se despliegan,
      # pero tampoco pueden tener vulnerabilidades moderadas o mayores. Las
      # bajas que no tienen version corregida se registran en el informe
      # como riesgo residual aceptado.
      - name: Dependencias de desarrollo sin vulnerabilidades moderadas o mayores
        if: ${{ !cancelled() }}
        working-directory: api-eva3
        run: npm audit --audit-level=moderate

      - name: Registros de las bases si algo fallo
        if: failure()
        run: docker compose logs --no-color --tail=200
